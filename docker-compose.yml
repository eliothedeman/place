services:
  place:
    # Published by .github/workflows/docker.yml on every push to master.
    # Pin to a sha- or v-tag for reproducible deploys: ghcr.io/eliothedeman/place:sha-abc1234
    image: ghcr.io/eliothedeman/place:latest
    # Uncomment for local builds (e.g. `podman compose up --build`):
    # build: .
    container_name: place
    restart: unless-stopped
    pull_policy: always

    # Shutdown waits for the mover loop to exit and bbolt + segments to
    # fsync. Default 10s is usually enough; 2m is a generous safety margin
    # if a hot→cold Move happens to be running at SIGTERM time.
    stop_signal: SIGTERM
    stop_grace_period: 2m

    # FUSE needs SYS_ADMIN + access to /dev/fuse. Default AppArmor blocks
    # mount(2), so it has to be disabled for this container.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse

    # Prometheus + healthz on :9090. Bind to 127.0.0.1 by default; flip to
    # 0.0.0.0:9090 if you scrape this from another host on a trusted network.
    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      # Hot tier — point at your fast (SSD/NVMe) TrueNAS dataset.
      - type: bind
        source: /mnt/tank/place-hot
        target: /mnt/hot

      # Cold tier — point at your slow (HDD) TrueNAS dataset.
      - type: bind
        source: /mnt/tank/place-cold
        target: /mnt/cold

      # FUSE mount — exposed back to the host. `rshared` propagation makes
      # the FUSE mount visible outside the container (e.g. to SMB/NFS shares
      # on TrueNAS). The host directory must itself be a shared mount; on
      # TrueNAS Scale /mnt is already rshared.
      - type: bind
        source: /mnt/tank/place
        target: /mnt/place
        bind:
          propagation: rshared

    # Extra placefs flags go here. Hot/cold/mount paths are wired up by
    # docker-entrypoint.sh, so do NOT pass --hot/--cold/--mount.
    #
    # The only flags you really need to set are --hot-max and --hot-target.
    # Without those, the mover never evicts and the hot drive will
    # eventually fill up. Pick a cap that fits your hot drive minus
    # headroom for live writes.
    #
    # Byte-sized flags accept human-readable values: 500GB, 1.5TiB,
    # 10MB, or a raw byte count. All multi-char suffixes are 1024-based.
    #
    # Sharing the mount with other containers (qbittorrent, sonarr, etc):
    #   --allow-other (default true) lets non-mounter UIDs touch the mount;
    #   --default-permissions (default true) has the kernel enforce mode
    #   bits, so chmod/chown on the mount actually take effect. Both are
    #   on by default — you only need to know about them if you set them
    #   off explicitly.
    #
    # New files are owned by the calling process's UID/GID. So if
    # qbittorrent runs as UID 1000, files it creates inside the mount
    # are owned by 1000 — which is what you want. Existing files
    # created before this fix are root-owned; chown them once on the
    # host (or via `exec -u 0` into the container).
    #
    # command:
    #   - --hot-max=500GB
    #   - --hot-target=400GB
    #
    #   # Optional: structured logs for aggregators (Loki, Datadog, etc).
    #   - --log-format=json
    #   # - --log-level=debug            # flip to debug when diagnosing
    #
    #   # Optional: mover poll interval (default 30s).
    #   # - --tick=10s
    #
    #   # Optional: enable /debug/pprof on :9090 when actively debugging.
    #   # Leave off — pprof leaks goroutine names + heap data.
    #   # - --debug-pprof
    #
    #   # Optional: FUSE ops slower than this log at debug level (default 1s).
    #   # - --slow-op-threshold=500ms
